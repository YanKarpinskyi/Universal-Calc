<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="main__calc">
                <input type="text" name="result" id="result">

                <button class="btn btn__num">1</button>
                <button class="btn btn__num">2</button>
                <button class="btn btn__num">3</button>
                <button class="btn btn__oper" id="btn__plus">+</button>

                <button class="btn btn__num">4</button>
                <button class="btn btn__num">5</button>
                <button class="btn btn__num">6</button>
                <button class="btn btn__oper" id="btn__minus">-</button>
                
                <button class="btn btn__num">7</button>
                <button class="btn btn__num">8</button>
                <button class="btn btn__num">9</button>
                <button class="btn btn__oper" id="btn__mult">*</button>
                
                <button class="btn btn__dot">.</button>
                <button class="btn btn__num" id="btn__zero">0</button>
                <button class="btn btn__cancel">C</button>
                <button class="btn btn__oper" id="btn__div">/</button>

                <button class="btn btn__result">=</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
