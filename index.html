<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <img class="design__signs" id="top-left__sign" src="./img/plus.png" alt="top-left__sign" width="130px">
    <img class="design__signs" id="top-right__sign" src="./img/multiple.png" alt="top-right__sign" width="130px">
    <img class="design__signs" id="bottom-left__sign" src="./img/minus.png" alt="bottom-left__sign" width="130px">
    <img class="design__signs" id="bottom-right__sign" src="./img/dividing.png" alt="bottom-right__sign" width="130px">
    
    <h1 id="heading">Universal Calc</h1>
    <nav class="switch__container">
        <button class="switch__btn" id="calc__switch">Calculator</button>
        <button class="switch__btn" id="unit_conv__switch">Measurement Converter</button>
        <button class="switch__btn" id="curr_conv__switch">Currency Converter</button>
    </nav>
    <div class="wrapper">
        <section class="main_calc__container">
            <div class="main__container">
                <input type="text" name="result" id="result">

                <button class="btn btn__num">1</button>
                <button class="btn btn__num">2</button>
                <button class="btn btn__num">3</button>
                <button class="btn btn__oper" id="btn__plus">+</button>

                <button class="btn btn__num">4</button>
                <button class="btn btn__num">5</button>
                <button class="btn btn__num">6</button>
                <button class="btn btn__oper" id="btn__minus">-</button>
                
                <button class="btn btn__num">7</button>
                <button class="btn btn__num">8</button>
                <button class="btn btn__num">9</button>
                <button class="btn btn__oper" id="btn__mult">*</button>
                
                <button class="btn btn__dot">.</button>
                <button class="btn btn__num" id="btn__zero">0</button>
                <button class="btn btn__cancel">C</button>
                <button class="btn btn__oper" id="btn__div">/</button>

                <button class="btn btn__result">=</button>
            </div>
            <div class="more__container">
                <button class="btn btn__more">More</button>
                <div id="more__operations">
                    <button class="btn btn__oper" id="btn__perc">%</button>
                    <button class="btn btn__oper" id="btn__sqrt">√</button>
                    <button class="btn btn__oper" id="btn__cbrt">∛</button>
                    <button class="btn btn__oper" id="btn__power">^</button>
                    <button class="btn btn__oper" id="btn__square">x²</button>
                    <button class="btn btn__oper" id="btn__cube">x³</button>
                    <button class="btn btn__oper" id="btn__mod">mod</button>
                    <button class="btn btn__oper" id="btn__exp">exp</button>
                    <button class="btn btn__oper" id="btn__abs">abs</button>
                    <button class="btn btn__oper" id="btn__plusMinus">±</button>
                    <button class="btn btn__oper" id="btn__log">log</button>
                    <button class="btn btn__oper" id="btn__ln">ln</button>
                    <button class="btn btn__oper" id="btn__factorial">!</button>
                    <button class="btn btn__oper" id="btn__sin">sin</button>
                    <button class="btn btn__oper" id="btn__cos">cos</button>
                    <button class="btn btn__oper" id="btn__tan">tan</button>
                    <button class="btn btn__oper" id="btn__asin">asin</button>
                    <button class="btn btn__oper" id="btn__acos">acos</button>
                    <button class="btn btn__oper" id="btn__atan">atan</button>
                </div>
            </div>
        </section>
        <section class="unit_conv__container">
            <div class="unit_inputs__container">
                <div class="input__container first__unit">
                    <input type="text" name="first__unit" id="first__unit" class="unit__input" />
                    <label id="first__unit__lbl" for="first__unit"></label>
                </div>
                <p>=</p>
                <div class="input__container second__unit">
                    <input type="text" name="second__unit" id="second__unit" class="unit__input" readonly/>
                    <label id="second__unit__lbl" for="second__unit"></label>
                </div>
            </div>
            <div class="unit_conv__values">
                <div class="unit__section" id="length__section">
                    <h2 class="unit__heading">Length</h2>
                    <button class="btn conv__btn" data-unit="mm">mm</button>
                    <button class="btn conv__btn" data-unit="cm">cm</button>
                    <button class="btn conv__btn" data-unit="m">m</button>
                    <button class="btn conv__btn" data-unit="km">km</button>
                    <button class="btn conv__btn" data-unit="in">in</button>
                    <button class="btn conv__btn" data-unit="ft">ft</button>
                    <button class="btn conv__btn" data-unit="yd">yd</button>
                    <button class="btn conv__btn" data-unit="mi">mi</button>
                </div>
                <div class="unit__section" id="volume__section">
                    <h2 class="unit__heading">Volume</h2>
                    <button class="btn conv__btn" data-unit="ml">ml</button>
                    <button class="btn conv__btn" data-unit="l">l</button>
                    <button class="btn conv__btn" data-unit="cm">cm<sup>3</sup></button>
                    <button class="btn conv__btn" data-unit="m">m<sup>3</sup></button>
                    <button class="btn conv__btn" data-unit="tsp">tsp</button>
                    <button class="btn conv__btn" data-unit="tbsp">tbsp</button>
                    <button class="btn conv__btn" data-unit="cup">cup</button>
                    <button class="btn conv__btn" data-unit="pt">pt</button>
                    <button class="btn conv__btn" data-unit="fl-oz">fl oz</button>
                    <button class="btn conv__btn" data-unit="gal">gal</button>
                    <button class="btn conv__btn" data-unit="qt">qt</button>
                    <button class="btn conv__btn" data-unit="cl">cl</button>
                </div>
                <div class="unit__section" id="weight__section">
                    <h2 class="unit__heading">Weight</h2>
                    <button class="btn conv__btn" data-unit="mg">mg</button>
                    <button class="btn conv__btn" data-unit="g">g</button>
                    <button class="btn conv__btn" data-unit="kg">kg</button>
                    <button class="btn conv__btn" data-unit="t">t</button>
                    <button class="btn conv__btn" data-unit="oz">oz</button>
                    <button class="btn conv__btn" data-unit="lb">lb</button>
                    <button class="btn btn__cancel">C</button>
                    <button class="btn btn__convert">Convert</button>
                    <button class="btn btn__reverse"><img src="./img/reverse.png" alt="reverse" width="30px"></button>
                </div>
                <div class="more__container">
                    <button class="btn btn__more">More</button>
                    <div id="more__measurements">
                        <div class="unit__section" id="area__section">
                            <h2 class="unit__heading">Area</h2>
                            <button class="btn conv__btn" id="btn__mm2" data-unit="mm2">mm<sup>2</sup></button>
                            <button class="btn conv__btn" id="btn__cm2" data-unit="cm2">cm<sup>2</sup></button>
                            <button class="btn conv__btn" id="btn__m2" data-unit="m2">m<sup>2</sup></button>
                            <button class="btn conv__btn" id="btn__km2" data-unit="km2">km<sup>2</sup></button>
                            <button class="btn conv__btn" id="btn__are" data-unit="a">a</button>
                            <button class="btn conv__btn" id="btn__ha" data-unit="ha">ha</button>
                            <button class="btn conv__btn" id="btn__in2" data-unit="in2">in<sup>2</sup></button>
                            <button class="btn conv__btn" id="btn__ft2" data-unit="ft2">ft<sup>2</sup></button>
                            <button class="btn conv__btn" id="btn__yd2" data-unit="yd2">yd<sup>2</sup></button>
                            <button class="btn conv__btn" id="btn__acre" data-unit="Acre">Acre</button>
                        </div>
                        <div class="unit__section" id="temper__section">
                            <h2 class="unit__heading" id="temper__heading" data-unit="Temperature">Temperature</h2>
                            <button class="btn conv__btn" id="btn__celsius" data-unit="°C">°C</button>
                            <button class="btn conv__btn" id="btn__fahrenheit" data-unit="°F">°F</button>
                            <button class="btn conv__btn" id="btn__kelvin" data-unit="K">K</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="curr_conv__container">
            <div class="unit_inputs__container">
                <div class="input__container first__unit">
                    <input type="text" name="first__unit" id="first__curr" class="unit__input" />
                    <label id="first__curr__lbl" for="first__curr"></label>
                </div>
                <p>=</p>
                <div class="input__container second__unit">
                    <input type="text" name="second__unit" id="second__curr" class="unit__input" readonly/>
                    <label id="second__curr__lbl" for="second__curr"></label>
                </div>
            </div>
            <div class="curr_conv__values">
                <div class="curr__section">
                    <h2 class="curr__heading">USD</h2>
                    <button class="btn conv__btn" data-curr="USD">$</button>
                </div>
                <div class="curr__section">
                    <h2 class="curr__heading">EUR</h2>
                    <button class="btn conv__btn" data-curr="EUR">€</button>
                </div>
                <div class="curr__section">
                    <h2 class="curr__heading">PLN</h2>
                    <button class="btn conv__btn" data-curr="PLN">zł</button>
                </div>
                <div class="curr__section">
                    <h2 class="curr__heading">UAH</h2>
                    <button class="btn conv__btn" data-curr="UAH">₴</button>
                </div>
            </div>
            <div class="curr_conv__manage">
                <button class="btn btn__cancel" id="curr_conv__cancel">C</button>
                <button class="btn btn__convert" id="curr_conv__convert">Convert</button>
                <button class="btn btn__reverse" id="curr_conv__reverse"><img src="./img/reverse.png" alt="reverse" width="30px"></button>
            </div>
        </section>
    </div>
  <script src="./js/measurements.js"></script>
  <script src="./js/currency.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
